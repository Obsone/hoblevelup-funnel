<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Hoblevelup funnel homepage preview</title>
  <desc id="desc">A real screenshot of the Hoblevelup homepage presented inside a polished browser frame.</desc>
  <defs>
    <linearGradient id="backdrop" x1="80" y1="12" x2="884" y2="534" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e7edff"/>
      <stop offset="0.48" stop-color="#f8f9ff"/>
      <stop offset="1" stop-color="#d6e2ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(794 64) rotate(132) scale(350 288)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f8eff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#4f8eff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="18" y="9" width="924" height="522" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#001849" flood-opacity=".22"/>
    </filter>
    <clipPath id="page-clip">
      <path d="M64 100h832v360a20 20 0 0 1-20 20H84a20 20 0 0 1-20-20V100Z"/>
    </clipPath>
  </defs>

  <rect width="960" height="540" fill="url(#backdrop)"/>
  <rect width="960" height="540" fill="url(#glow)"/>
  <circle cx="76" cy="474" r="138" fill="#ffffff" opacity=".5"/>

  <g filter="url(#shadow)">
    <rect x="48" y="44" width="864" height="452" rx="28" fill="#ffffff"/>
    <path d="M76 44h808a28 28 0 0 1 28 28v40H48V72a28 28 0 0 1 28-28Z" fill="#ffffff"/>
    <path d="M48 112h864" stroke="#dfe3ef"/>

    <circle cx="80" cy="78" r="6" fill="#ff7067"/>
    <circle cx="102" cy="78" r="6" fill="#f7bd4b"/>
    <circle cx="124" cy="78" r="6" fill="#56c66a"/>

    <rect x="176" y="62" width="608" height="32" rx="16" fill="#f2f3f8"/>
    <path d="m202 77 3-3 3 3m-6 0 3 3 3-3" fill="none" stroke="#7c8292" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/>
    <text x="224" y="82" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#555b6b">hoblevelup.work</text>
    <path d="M760 73a6 6 0 1 1-1.8 4.3" fill="none" stroke="#7c8292" stroke-linecap="round" stroke-width="1.5"/>

    <image href="hoblevelup-homepage-hero.png" x="64" y="100" width="832" height="520" preserveAspectRatio="xMidYMin slice" clip-path="url(#page-clip)"/>
  </g>

  <path d="M74 493h812" stroke="#ffffff" stroke-opacity=".7"/>
</svg>
